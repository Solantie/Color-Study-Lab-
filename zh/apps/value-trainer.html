<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色感练习 V4 · 明度训练</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#242824;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 15px 40px}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0 0 12px}p,small{color:#666;line-height:1.6}section{background:white;border:1px solid #ddd;border-radius:16px;padding:16px;margin:14px 0}button,select,label.upload{font:inherit;padding:11px;border-radius:9px;border:1px solid #ddd;background:#f4f4f1;cursor:pointer}button.primary{background:#252825;color:white}button:disabled{opacity:.45}input[type=file]{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.stage{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stage canvas{width:100%;height:auto;display:block;border-radius:8px;cursor:crosshair;touch-action:manipulation}.stage small{display:block;margin-bottom:5px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chips button{min-width:44px;padding:6px;background:white}.chips button.active{outline:2px solid #333}.chip{height:25px;border:1px solid #bbb;border-radius:4px;margin-bottom:4px}.track{position:relative;margin:20px 0}.track input{appearance:none;width:100%;height:16px;margin:0;border-radius:8px;background:linear-gradient(to right,#000,#fff);border:1px solid #aaa;display:block}.track input::-webkit-slider-thumb{appearance:none;width:10px;height:30px;background:white;border:2px solid #111;border-radius:2px}.track input::-moz-range-thumb{width:6px;height:26px;background:white;border:2px solid #111;border-radius:2px}.marker{position:absolute;top:50%;height:30px;width:10px;transform:translate(-50%,-50%);background:#e53935;border:2px solid white;border-radius:2px;pointer-events:none}.samples{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sample{height:50px;border-radius:7px;border:1px solid #aaa}.result{background:#f1f3ef;padding:12px;border-radius:10px;margin-top:12px;white-space:pre-line} [hidden]{display:none!important} @media(max-width:380px){section{padding:10px}.stage{gap:6px}}
.langnav{display:flex;align-items:center;justify-content:space-between;gap:14px;font:13px system-ui,sans-serif;margin:0 0 16px;color:#58675c}.langnav a{color:#355e48;text-decoration:none}.langnav a:hover{text-decoration:underline}</style><main><nav class="langnav"><a href="../index.html">← 返回首页</a><span><b>中文</b> · <a href="../../en/apps/value-trainer.html">English</a></span></nav><h1>色感练习 ✦ V4</h1><p>黑白灰 · 明度色阶还原</p><section><h2>01 · 选择练习图片</h2><div class="row"><label class="upload">上传图片<input id="file" type="file" accept="image/*"></label><button id="demo">示例图</button><label>色阶 <select id="levels"></select></label></div><p id="status" aria-live="polite"></p><small>按照灰度划分区间，每个区间采用实际像素的平均灰度，避免固定答案总是等距排列。</small></section><section><h2>02 · 观察并还原明度</h2><div class="stage"><div><small>目标 · 黑白色阶图</small><canvas id="target"></canvas></div><div><small>你的填色 · 点击选择区域</small><canvas id="mine"></canvas></div></div><div id="chips" class="chips"></div><small>同一色阶的所有区域共用一个明度值。白色轮廓表示当前选择。</small></section><section><div class="row"><h2 id="title">03 · 调整明度</h2><strong id="value">50</strong></div><div class="samples"><div><small>目标区域</small><div class="sample" id="ref"></div></div><div><small>你的明度</small><div class="sample" id="swatch"></div></div></div><div class="track"><input id="slider" type="range" min="0" max="100" step="1" value="50" aria-label="明度"><span id="marker" class="marker" hidden></span></div><div class="row"><small>0 · 黑</small><small>100 · 白</small></div><div class="row" style="margin-top:15px"><button id="reset">重新练习</button><button class="primary" id="check">检查匹配度</button></div><div class="result" id="result" hidden aria-live="polite"></div><p id="hint" hidden>红色锚点 = 目标明度；白色滑块 = 你的选择。</p></section><small>图片在本机处理，无需联网。采用 sRGB 加权灰度作为练习明度，非 HSB B 或 CIELAB L*。</small></main><script>
const $=x=>document.getElementById(x);let source=null,w=0,h=0,labels=[],targets=[],guesses=[],counts=[],active=0,checked=false,token=0;const gray=v=>Math.round(v*255/100),css=v=>`rgb(${gray(v)},${gray(v)},${gray(v)})`;for(let i=2;i<=12;i++)$('levels').add(new Option(i+' 阶',i,i===5,i===5));
function generate(){if(!source)return;let sw=source.naturalWidth||source.width,sh=source.naturalHeight||source.height,scale=Math.min(1,1100/Math.max(sw,sh));w=Math.max(1,Math.round(sw*scale));h=Math.max(1,Math.round(sh*scale));let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,w,h);ctx.drawImage(source,0,0,w,h);let p=ctx.getImageData(0,0,w,h).data,k=+$('levels').value,sums=Array(k).fill(0),n=Array(k).fill(0),raw=new Uint8Array(w*h);for(let i=0;i<raw.length;i++){let q=i*4,v=(.2126*p[q]+.7152*p[q+1]+.0722*p[q+2])/255*100,j=Math.min(k-1,Math.floor(v*k/100));raw[i]=j;sums[j]+=v;n[j]++}let map=[];targets=[];counts=[];n.forEach((v,j)=>{if(v){map[j]=targets.length;targets.push(Math.round(sums[j]/v));counts.push(v)}});labels=Uint8Array.from(raw,j=>map[j]);$('status').textContent=`已生成 ${targets.length} 个有效色阶 · ${w} × ${h} 像素`;reset()}
function reset(){guesses=targets.map(()=>50);active=0;checked=false;$('result').hidden=true;render()}
function draw(id,values,outline){let c=$(id);c.width=w;c.height=h;let ctx=c.getContext('2d'),im=ctx.createImageData(w,h),p=im.data;for(let i=0;i<labels.length;i++){let v=gray(values[labels[i]]),x=i%w,y=Math.floor(i/w);if(outline&&labels[i]===active&&(x===0||x===w-1||y===0||y===h-1||labels[i-1]!==active||labels[i+1]!==active||labels[i-w]!==active||labels[i+w]!==active))v=255;let q=i*4;p[q]=p[q+1]=p[q+2]=v;p[q+3]=255}ctx.putImageData(im,0,0)}
function render(){if(!targets.length)return;draw('target',targets,false);draw('mine',guesses,true);$('chips').replaceChildren();guesses.forEach((v,i)=>{let b=document.createElement('button');b.className=i===active?'active':'';b.setAttribute('aria-pressed',i===active);let c=document.createElement('div');c.className='chip';c.style.background=css(v);b.append(c,`阶 ${i+1}`);b.onclick=()=>{active=i;render()};$('chips').append(b)});$('slider').value=guesses[active];$('value').textContent=guesses[active];$('title').textContent='03 · 调整色阶 '+(active+1);$('ref').style.background=css(targets[active]);$('swatch').style.background=css(guesses[active]);$('marker').hidden=!checked;$('hint').hidden=!checked;$('marker').style.left=`calc(${targets[active]}% + ${5-targets[active]*.1}px)`;if(checked)score()}
function score(){let errors=targets.map((v,i)=>Math.abs(v-guesses[i])),avg=errors.reduce((a,b)=>a+b,0)/errors.length;$('result').hidden=false;$('result').textContent=`平均匹配度 ${Math.round(100-avg)} / 100\n`+targets.map((v,i)=>`色阶 ${i+1}：目标 ${v} · 你的 ${guesses[i]} · 偏差 ${errors[i]}`).join('\n')}
$('slider').oninput=()=>{guesses[active]=+$('slider').value;render()};$('check').onclick=()=>{checked=true;render()};$('reset').onclick=reset;$('levels').onchange=generate;for(let id of ['target','mine'])$(id).onclick=e=>{let r=e.currentTarget.getBoundingClientRect(),x=Math.min(w-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*w))),y=Math.min(h-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*h)));active=labels[y*w+x];render()};
function demo(){token++;let c=document.createElement('canvas');c.width=720;c.height=480;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,'#b9d3da');g.addColorStop(1,'#f0cfa4');x.fillStyle=g;x.fillRect(0,0,720,480);x.fillStyle='#fce8b8';x.beginPath();x.arc(530,100,50,0,7);x.fill();for(let [col,y,a,b] of [['#87968a',260,130,230],['#4d756c',340,220,310],['#34483f',425,330,390]]){x.fillStyle=col;x.beginPath();x.moveTo(0,y);x.quadraticCurveTo(160,a,340,y);x.quadraticCurveTo(550,b,720,y);x.lineTo(720,480);x.lineTo(0,480);x.fill()}source=c;generate()};$('demo').onclick=demo;$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=++token,u=URL.createObjectURL(f),im=new Image();try{im.src=u;await im.decode();if(t===token){source=im;generate()}}catch(err){if(t===token)$('status').textContent='无法读取图片，请尝试 JPG 或 PNG。'}finally{URL.revokeObjectURL(u);e.target.value=''}};demo();
</script></html>
