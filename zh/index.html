</head><body><main><header><nav class="homelang"><b>中文</b> · <a href="../en/index.html">English</a></nav><div class="eyebrow">个人创意编程项目</div><h1>Color Study Lab <span aria-hidden="true">✦</span></h1><p>在浏览器中练习色彩感知、黑白灰明度与色彩归纳。选择一个练习即可开始，无需安装。</p></header><section class="grid" aria-label="练习模块"><a href="apps/hsb-trainer.html" class="card"><div class="art hsb"></div><div class="body"><span class="number">01 / 色彩匹配</span><h2>HSB 色彩训练</h2><p>通过色相、饱和度、明度滑块还原目标颜色，提交后查看正确取值。</p><span class="link">开始练习 →</span></div></a><a href="apps/value-trainer.html" class="card"><div class="art value"></div><div class="body"><span class="number">02 / 黑白灰明度</span><h2>黑白灰明度训练</h2><p>将图片转换为少量黑白灰色阶，并逐阶练习明度判断。</p><span class="link">开始练习 →</span></div></a><a href="apps/photo-color-study.html" class="card"><div class="art photo"><svg viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="300" height="140" fill="#bed6db"/><circle cx="235" cy="42" r="23" fill="#e4bb87"/><path d="M0 100 Q80 23 152 101 Q227 41 300 93 V140 H0" fill="#809f8c"/><path d="M0 126 Q98 65 175 117 Q238 88 300 110 V140 H0" fill="#b77f68"/></svg></div><div class="body"><span class="number">03 / 照片色彩归纳</span><h2>照片色彩归纳</h2><p>上传参考图片，提取有限数量的主色，并通过滑块逐区域还原。</p><span class="link">开始练习 →</span></div></a></section><footer>实验性原型 · 图片仅在浏览器本地处理 · <a href="../README.zh-CN.md" style="color:inherit">阅读项目说明</a></footer></main></body></html>
